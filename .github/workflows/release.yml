# Builds the installers players download, one per platform, and publishes them
# as a GitHub Release — the release page is the link you hand out.
#
# There is no way around building each platform on its own machine: the app
# ships a native Prisma engine, and the engine for Windows only exists on a
# Windows runner. Hence one job per artefact:
#
#   macOS (Apple Silicon)  → Fuoriclasse-<ver>-arm64.dmg
#   Windows                → Fuoriclasse Setup <ver>.exe
#
# Intel Macs are not built. The macos-13 runners that could do it sat queued
# for over an hour on every attempt while the other two finished in four
# minutes, and Apple stopped selling Intel Macs in 2023. Add a third entry to
# the matrix with `os: macos-13` if one is ever needed — the packaging itself
# is platform-agnostic and was working, only the runner never arrived.
#
# To publish a version: bump `version` in package.json, then
#   git tag v0.1.0 && git push origin v0.1.0
# Or run this workflow by hand from the Actions tab (it then publishes a
# release named after the run).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac-apple-silicon
            command: desktop:package:mac
          - os: windows-latest
            name: windows
            command: desktop:package:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }}
        env:
          # No Apple Developer certificate: the app ships unsigned, and the
          # install guide explains the one-time right-click → Open.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          ls -lh installers
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Fuoriclasse $TAG" \
            --notes "Scarica il file adatto al tuo computer:

          - **Mac con chip Apple (M1/M2/M3/M4)** → il file \`.dmg\`
          - **Windows** → il file \`.exe\`

          Su Mac: apri il \`.dmg\` e trascina Fuoriclasse in Applicazioni. La prima
          volta aprila con **tasto destro → Apri → Apri**, non con il doppio clic.
          Su Windows, se Defender avvisa: **Altre informazioni → Esegui comunque**.
          Succede perché il gioco non è firmato con un certificato a pagamento.

          I Mac con processore Intel non sono supportati.

          Gioco di esclusiva proprietà di Davide Simonetti. Tutti i diritti riservati."
